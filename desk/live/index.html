<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.187e1258.css">
<style>
body { background: #0f1115; color: #d7dbe3; }
.site-header { background: #0f1115; border-bottom: 1px solid #22262e; }
.live-root { max-width: 1280px; margin: 0 auto; padding: 0.75rem 1rem 2rem; font-family: "IBM Plex Sans", sans-serif; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; padding: 0.6rem 0.9rem; background: #141822; border: 1px solid #22262e; border-radius: 4px; margin-bottom: 0.75rem; }
.topbar .title { flex: 1; min-width: 240px; font-size: 0.92rem; color: #a9afbb; }
.topbar .title b { color: #e8ecf3; }
.topbar button { background: #22262e; color: #d7dbe3; border: 1px solid #2d3240; padding: 4px 10px; border-radius: 3px; font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; cursor: pointer; }
.topbar button.active { background: #3ddc84; color: #0f1115; border-color: #3ddc84; }
.topbar button:hover { background: #2d3240; }
.progressbar { flex-basis: 100%; height: 3px; background: #22262e; border-radius: 2px; margin-top: 0.4rem; overflow: hidden; }
.progressbar .fill { height: 100%; background: #3ddc84; width: 0; transition: width 0.3s linear; }
.live-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 0.75rem; }
.doc-pane { background: #141822; border: 1px solid #22262e; border-radius: 4px; padding: 0.75rem; max-height: 72vh; overflow: auto; position: relative; }
.doc-pane .doc-header { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; color: #8089a0; margin-bottom: 0.5rem; padding-bottom: 0.4rem; border-bottom: 1px dashed #22262e; }
.doc-text { font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; line-height: 1.5; white-space: pre-wrap; color: #a9afbb; position: relative; }
.fact-mark { background: transparent; border: 1px solid #3ddc84; border-radius: 2px; padding: 0 2px; color: #e8ecf3; position: relative; }
.fact-mark.rev { border-color: #ffb44f; }
.fact-mark.eps { border-color: #3ddc84; }
.fact-mark.bl { border-color: #7ac2ff; }
.fact-mark.ut { border-color: #c084ff; }
.fact-mark.di { border-color: #ff7a97; }
.fact-mark.ni { border-color: #ffdd59; }
.fact-mark.fl { border-color: #68d4a4; }
.fact-tag { display: inline-block; margin-left: 4px; padding: 1px 4px; font-size: 0.7rem; background: #22262e; color: #a9afbb; border-radius: 2px; }
.map-pane { background: #141822; border: 1px solid #22262e; border-radius: 4px; padding: 0.5rem 0.6rem; min-height: 72vh; max-height: 72vh; overflow: auto; position: relative; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: #a9afbb; }
.map-host { margin: 0 0 0.5rem; padding: 0 0 0.35rem; border-bottom: 1px dashed #22262e; }
.map-host .host-label { color: #3ddc84; font-weight: 600; font-size: 11px; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
.map-host .host-label .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; display: inline-block; }
.map-doc { margin: 2px 0 2px 14px; color: #7ac2ff; font-size: 11px; display: flex; align-items: baseline; gap: 6px; }
.map-doc .dot { width: 5px; height: 5px; border-radius: 50%; background: #7ac2ff; display: inline-block; flex-shrink: 0; }
.map-doc .meta { color: #6b7083; }
.map-fact { margin: 1px 0 1px 32px; color: #ffb44f; font-size: 11px; display: flex; align-items: baseline; gap: 6px; }
.map-fact .dot { width: 4px; height: 4px; border-radius: 50%; background: #ffb44f; display: inline-block; flex-shrink: 0; }
.map-fact .lv { color: #d7dbe3; }
.series-synth .k { color: #8089a0; margin-right: 8px; }
.series-synth .v { color: #e8ecf3; }
.statusline { margin-top: 0.75rem; padding: 0.4rem 0.75rem; background: #141822; border: 1px solid #22262e; border-radius: 4px; font-family: "IBM Plex Mono", monospace; font-size: 0.78rem; color: #a9afbb; min-height: 1.2em; }
.statusline b { color: #3ddc84; }
.loading { padding: 1rem; color: #8089a0; }
.rules { margin-top: 1rem; font-size: 0.75rem; color: #6b7083; }
@media (max-width: 760px) {
  .live-grid { grid-template-columns: 1fr; }
  .doc-pane, .map-pane { max-height: 50vh; min-height: 300px; }
}
</style>
</head>
<body>
<header class="site-header">
  <div class="site-header-inner">
    <a class="brand" href="/" aria-label="BMG Capital home">
      <span class="brand-mark">
        <svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><polyline points="5,23 12,15 18,19 27,8" fill="none" stroke="#3ddc84" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></polyline></svg>
      </span>
      <span class="brand-wm">BMG CAPITAL</span>
    </a>
    <nav aria-label="Main" class="site-nav">
      <a href="/">Home</a>
      <a href="/tool/">Research tool</a>
      <a href="/desk/">Desk</a>
      <a href="/desk/live/" aria-current="page">Desk live</a>
      <a href="/research.html">Research</a>
    </nav>
  </div>
</header>
<main class="live-root">
  <div class="topbar">
    <div class="title" id="replay-title">Loading replay...</div>
    <button class="mode-btn active" data-mode="replay">Replay</button>
    <button class="mode-btn" data-mode="live">Live</button>
    <span id="replay-controls">
      <button id="btn-play" aria-pressed="true">Pause</button>
      <button class="speed-btn" data-speed="10">10x</button>
      <button class="speed-btn" data-speed="60">60x</button>
      <button class="speed-btn" data-speed="300">300x</button>
    </span>
    <span id="live-controls" style="display:none">
      <select id="live-ticker" style="background:#22262e;color:#d7dbe3;border:1px solid #2d3240;padding:3px 6px;border-radius:3px;font-family:inherit;font-size:0.8rem">
        <option value="GATX">GATX</option>
        <option value="GBX">GBX</option>
        <option value="TRN">TRN</option>
      </select>
      <select id="live-mode" style="background:#22262e;color:#d7dbe3;border:1px solid #2d3240;padding:3px 6px;border-radius:3px;font-family:inherit;font-size:0.8rem">
        <option value="new">New only</option>
        <option value="rewalk30">Re-walk 30 days</option>
      </select>
      <button id="btn-run" style="background:#3ddc84;color:#0f1115;border:none;padding:4px 12px;border-radius:3px;font-weight:600;cursor:pointer">Run</button>
      <span id="live-status" style="color:#8089a0;font-size:0.8rem"></span>
    </span>
    <div class="progressbar"><div class="fill" id="progress-fill"></div></div>
  </div>
  <div class="live-grid">
    <div class="doc-pane">
      <div class="doc-header" id="doc-header">(no document yet)</div>
      <div class="doc-text" id="doc-text"><div class="loading">waiting for /desk/run/latest...</div></div>
    </div>
    <div class="map-pane" id="map-pane">(loading map)</div>
  </div>
  <div class="statusline" id="statusline">idle</div>
  <div class="rules">Playback pacing is synthetic and labeled above. Every box is a stored row from <code>/data/intake.db</code>. No article bodies, no paywalled sources, no fake activity.</div>
</main>

<script>
(() => {
  const state = {
    events: [],
    idx: 0,
    speed: 60,
    playing: true,
    runStart: null,
    runEnd: null,
    tickTimer: null,
    nodes: {}, // doc_id -> {x,y} or host -> {x,y}
    docsLoaded: {}, // doc_id -> text
    currentDocId: null,
  };

  const mapPane = document.getElementById("map-pane");
  mapPane.innerHTML = "";
  const hostBlocks = {}; // host -> {el, docs: {doc_id: el}}

  function hostBlock(host) {
    if (hostBlocks[host]) return hostBlocks[host];
    const el = document.createElement("div");
    el.className = "map-host";
    el.innerHTML = `<div class="host-label"><span class="dot"></span><span>${host}</span></div>`;
    mapPane.appendChild(el);
    hostBlocks[host] = {el, docs: {}};
    return hostBlocks[host];
  }

  function pickDefaultSpeed(nEvents, totalRealSec) {
    const choices = [10, 60, 300];
    const minPerEv = 0.05;
    const estTime = (s) => Math.max(nEvents * minPerEv, totalRealSec / s);
    let best = choices[0], bestDiff = Infinity;
    for (const s of choices) {
      const diff = Math.abs(estTime(s) - 75);
      if (diff < bestDiff) { best = s; bestDiff = diff; }
    }
    return best;
  }

  function setActiveSpeed(s) {
    state.speed = s;
    document.querySelectorAll(".speed-btn").forEach(x => {
      x.classList.toggle("active", parseInt(x.dataset.speed, 10) === s);
    });
  }

  function fmt(ts) {
    if (!ts) return "";
    const d = new Date(ts);
    return isNaN(d) ? ts : d.toLocaleString("en-US", { timeZone: "America/Chicago", month: "short", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function colorForLabel(label) {
    const m = {Revenue:"rev", EPS:"eps", "Backlog units":"bl", "Backlog $B":"bl", Fleet:"fl", Utilization:"ut", Dividend:"di", "Net income":"ni", Carloads:"bl", Intermodal:"bl", DGS10:"rev", DGS2:"rev", DGS5:"rev", DGS30:"rev", SOFR:"di", DFF:"di", BAMLC0A0CM:"ni", BAMLH0A0HYM2:"ni", T10Y2Y:"eps", INDPRO:"fl", RAILFRTCARLOADSD11:"bl", RAILFRTINTERMODALD11:"bl"};
    return m[label] || "ut";
  }

  async function fetchJSON(url) {
    try { const r = await fetch(url, {cache: "no-store"}); if (!r.ok) throw new Error(r.status); return await r.json(); }
    catch (e) { return {error: String(e)}; }
  }

  async function init() {
    const data = await fetchJSON("/desk/run/latest?window=14400&limit=200");
    if (data.error || !data.events || data.events.length === 0) {
      document.getElementById("replay-title").innerHTML = "No completed run yet";
      document.getElementById("doc-text").innerHTML = '<div class="loading">no completed run yet</div>';
      const h = await fetchJSON("/desk/health");
      document.getElementById("statusline").textContent = JSON.stringify(h, null, 2).slice(0, 500);
      return;
    }
    state.events = data.events;
    state.runStart = new Date(data.started_at);
    state.runEnd = new Date(data.ended_at || data.started_at);
    const n = state.events.length;
    const d = state.runEnd - state.runStart;
    const realSec = Math.max(1, Math.round(d/1000));
    // Pick default speed so the full replay takes 60 to 90 s where possible
    const def = pickDefaultSpeed(n, realSec);
    setActiveSpeed(def);
    const title = document.getElementById("replay-title");
    title.innerHTML = `Replay of run <b>${fmt(data.started_at)} Central</b> playing at <b>${state.speed}x</b>. ${n} events, ${realSec} s real time. Every box is a stored row.`;
    tick();
  }

  function tick() {
    if (!state.playing) return;
    if (state.idx >= state.events.length) { state.playing = false; document.getElementById("btn-play").textContent = "Replay done"; return; }
    const ev = state.events[state.idx];
    const nextIdx = state.idx + 1;
    renderEvent(ev);
    state.idx = nextIdx;
    // Compute next delay: real gap scaled by speed, clamped to 50-5000ms
    let delay = 400;
    if (nextIdx < state.events.length) {
      const t0 = new Date(ev.fetched_at || ev.at || state.runStart).getTime();
      const t1 = new Date(state.events[nextIdx].fetched_at || state.events[nextIdx].at || t0).getTime();
      const real_ms = Math.max(0, t1 - t0);
      delay = Math.min(5000, Math.max(50, real_ms / state.speed));
    }
    // Progress bar
    const pct = Math.round((state.idx / state.events.length) * 100);
    document.getElementById("progress-fill").style.width = pct + "%";
    clearTimeout(state.tickTimer);
    state.tickTimer = setTimeout(tick, delay);
  }

  function renderEvent(ev) {
    const status = document.getElementById("statusline");
    if (ev.type === "document") {
      status.innerHTML = `<b>${ev.job || ""}</b> fetching ${ev.host} <span style="color:#6b7083">${ev.url.slice(0, 100)}</span>`;
      addMapNode(ev);
      loadDoc(ev);
    } else if (ev.type === "fact") {
      status.innerHTML = `fact extracted: <b>${ev.label}</b> = ${ev.value} ${ev.unit || ""}`;
      addMapFact(ev);
      markFactInDoc(ev);
    }
  }

  async function loadDoc(ev) {
    document.getElementById("doc-header").textContent = `${ev.ticker || ""} ${ev.doc_type}: ${(ev.title || "").slice(0, 120)}`;
    const pane = document.getElementById("doc-text");
    pane.scrollTop = 0;
    state.currentDocId = ev.doc_id;
    if (ev.doc_type === "NEWS") {
      pane.innerHTML = `<div style="color:#8089a0">Headline only (article body never stored):</div><div style="margin-top:6px">${(ev.title || "").replace(/</g,"&lt;")}</div>`;
      return;
    }
    // SERIES rows have no extracted text file; synthesize a short body from the
    // stored row (series id, value, observation date, source host). The replay
    // then draws a fact box around the value using the stored meta.
    if (ev.doc_type === "SERIES") {
      const m = ev.meta || {};
      const sid = m.series_id || ev.title || "SERIES";
      const val = (m.last_value != null) ? String(m.last_value) : "";
      const d = m.last_date || "";
      const synth = `series: ${sid}
value:  ${val}
as of:  ${d}
source: ${ev.host}
url:    ${ev.url}
`;
      // Store the synthesized text so the fact-marker code can find it
      state.docsLoaded[ev.doc_id] = {text: synth, synthetic: true};
      // Place a fact mark around the value substring (offset after "value:  ")
      const vStart = synth.indexOf("value:  ") + "value:  ".length;
      const html = escapeHTML(synth.slice(0, vStart)) +
        `<span class="fact-mark rev">${escapeHTML(val)}<span class="fact-tag">${sid} ${val}${d ? " (" + d + ")" : ""}</span></span>` +
        escapeHTML(synth.slice(vStart + val.length));
      pane.innerHTML = html;
      return;
    }
    if (!ev.has_text) {
      pane.innerHTML = `<div style="color:#8089a0">(no extracted text for this document)</div>`;
      return;
    }
    let doc = state.docsLoaded[ev.doc_id];
    if (!doc) {
      doc = await fetchJSON("/desk/doc/" + encodeURIComponent(ev.doc_id) + "/text");
      state.docsLoaded[ev.doc_id] = doc;
    }
    if (doc.error) {
      pane.innerHTML = `<div style="color:#ff7a97">doc text error: ${doc.error}</div>`;
      return;
    }
    const text = (doc.text || "").slice(0, 60000);
    pane.setAttribute("data-doc-id", ev.doc_id);
    pane.innerHTML = escapeHTML(text);
  }

  function escapeHTML(s) {
    return (s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  function markFactInDoc(ev) {
    if (ev.doc_id !== state.currentDocId) return;
    const pane = document.getElementById("doc-text");
    const doc = state.docsLoaded[ev.doc_id];
    if (!doc || !doc.text) return;
    const text = doc.text;
    let offset = ev.char_offset;
    if (offset == null || offset < 0) {
      offset = text.indexOf(ev.value);
      if (offset < 0) return;
    }
    // Rebuild the pane preserving existing marks: we work on the original text
    // and apply all currently-shown marks for this doc up to this event.
    const facts = state.events.filter(e => e.type === "fact" && e.doc_id === ev.doc_id).slice(0, state.idx + 1).filter(e => state.events.indexOf(e) <= state.idx);
    const ranges = [];
    facts.forEach(f => {
      let off = f.char_offset;
      let v = f.value || "";
      if (!v) return;
      if (off == null || off < 0) off = text.indexOf(v);
      if (off < 0) return;
      ranges.push({start: off, end: off + v.length, label: f.label, value: v, unit: f.unit, cls: colorForLabel(f.label)});
    });
    ranges.sort((a,b) => a.start - b.start);
    // Collapse overlaps
    const merged = [];
    ranges.forEach(r => {
      const last = merged[merged.length - 1];
      if (last && r.start < last.end) return;
      merged.push(r);
    });
    let html = "";
    let cursor = 0;
    merged.forEach(r => {
      html += escapeHTML(text.slice(cursor, r.start));
      html += `<span class="fact-mark ${r.cls}">${escapeHTML(text.slice(r.start, r.end))}<span class="fact-tag">${r.label} ${r.value}${r.unit ? " " + r.unit : ""}</span></span>`;
      cursor = r.end;
    });
    html += escapeHTML(text.slice(cursor));
    pane.innerHTML = html;
    // Scroll to the newest mark
    const marks = pane.querySelectorAll(".fact-mark");
    if (marks.length) marks[marks.length - 1].scrollIntoView({block:"center", behavior:"smooth"});
  }

  // HTML-based map: hosts as labeled sections, docs under each host with
  // "DOC_TYPE TICKER" label and full title on hover, facts under each doc
  // with "label = value" text. 11px min font. Scrollable when it fills up.
  function addMapNode(ev) {
    const host = ev.host || "unknown";
    const hb = hostBlock(host);
    if (hb.docs[ev.doc_id]) return;
    const docEl = document.createElement("div");
    docEl.className = "map-doc";
    const metaBits = [ev.doc_type || "", ev.ticker || ""].filter(Boolean).join(" ");
    docEl.innerHTML = `<span class="dot"></span><span>${metaBits}</span><span class="meta" title="${(ev.title || "").replace(/"/g, "&quot;")}">${(ev.title || "").slice(0, 42)}${(ev.title || "").length > 42 ? "..." : ""}</span>`;
    docEl.title = ev.title || ev.url || "";
    hb.el.appendChild(docEl);
    hb.docs[ev.doc_id] = docEl;
    state.nodes[ev.doc_id] = {host, el: docEl};
    // Autoscroll map pane so newest entry is visible
    mapPane.scrollTop = mapPane.scrollHeight;
  }
  function addMapFact(ev) {
    const node = state.nodes[ev.doc_id];
    if (!node) return;
    const factEl = document.createElement("div");
    factEl.className = "map-fact";
    const unit = ev.unit ? " " + ev.unit : "";
    factEl.innerHTML = `<span class="dot"></span><span class="lv">${ev.label} = ${ev.value}${unit}</span>`;
    factEl.title = `${ev.label} = ${ev.value}${unit}`;
    // Insert immediately after the doc row (so facts cluster under their doc)
    node.el.insertAdjacentElement("afterend", factEl);
    mapPane.scrollTop = mapPane.scrollHeight;
  }

  // Controls
  document.getElementById("btn-play").addEventListener("click", (e) => {
    state.playing = !state.playing;
    e.target.textContent = state.playing ? "Pause" : "Play";
    if (state.playing) tick();
  });
  document.querySelectorAll(".speed-btn").forEach(b => {
    b.addEventListener("click", (e) => {
      const s = parseInt(b.dataset.speed, 10) || 60;
      setActiveSpeed(s);
      const title = document.getElementById("replay-title");
      if (title && title.innerHTML.includes("playing at")) {
        title.innerHTML = title.innerHTML.replace(/playing at <b>\d+x<\/b>/, `playing at <b>${s}x</b>`);
      }
    });
  });

  // Mode toggle Replay / Live
  const liveState = { es: null, running: false, startedAt: null, clockTimer: null };
  function setMode(mode) {
    document.querySelectorAll(".mode-btn").forEach(x => x.classList.toggle("active", x.dataset.mode === mode));
    document.getElementById("replay-controls").style.display = (mode === "replay") ? "" : "none";
    document.getElementById("live-controls").style.display = (mode === "live") ? "" : "none";
    if (mode === "live") {
      // Pause replay cleanly
      state.playing = false;
      clearTimeout(state.tickTimer);
      document.getElementById("replay-title").textContent = "Live mode. Click Run to start a real network pull.";
      document.getElementById("doc-text").innerHTML = '<div class="loading">waiting for Run...</div>';
      document.getElementById("doc-header").textContent = "(no document yet)";
      // Reset map
      mapPane.innerHTML = "";
      for (const k in hostBlocks) delete hostBlocks[k];
      for (const k in state.nodes) delete state.nodes[k];
    } else {
      stopLive();
      init();
    }
  }
  document.querySelectorAll(".mode-btn").forEach(b => {
    b.addEventListener("click", () => setMode(b.dataset.mode));
  });

  function stopLive() {
    if (liveState.es) { try { liveState.es.close(); } catch(e) {} liveState.es = null; }
    liveState.running = false;
    if (liveState.clockTimer) { clearInterval(liveState.clockTimer); liveState.clockTimer = null; }
  }

  function liveHandle(ev) {
    const status = document.getElementById("statusline");
    const t = ev.type;
    if (t === "heartbeat" || t === "hello") {
      document.getElementById("live-status").textContent = "connected, " + t;
      return;
    }
    if (t === "job_start") {
      status.innerHTML = `<b>${ev.label}</b> starting`;
      return;
    }
    if (t === "fetch_start") {
      status.innerHTML = `<b>fetching</b> ${ev.host} <span style="color:#6b7083">${(ev.url || "").slice(0, 110)}</span>`;
      return;
    }
    if (t === "fetch_done" || t === "fetch_done_insert") {
      // Attach to map when we have an insert event with doc_id + doc_type
      if (t === "fetch_done_insert" && ev.doc_id) {
        const from_url = ev.source_url || "";
        let host = "";
        try { host = new URL(from_url).hostname; } catch (e) {}
        const docEv = {
          type: "document", doc_id: ev.doc_id, host, url: from_url,
          title: ev.title, doc_type: ev.doc_type, ticker: ev.ticker,
          fetched_at: ev.at, has_text: ev.doc_type !== "SERIES" && ev.doc_type !== "NEWS",
          meta: {}, dim: !!ev.skipped_dup
        };
        addMapNode(docEv);
        if (docEv.dim) {
          const el = state.nodes[ev.doc_id];
          if (el && el.el) {
            el.el.style.opacity = "0.4";
            el.el.innerHTML += '<span class="meta" style="color:#6b7083"> (already stored)</span>';
          }
        } else {
          loadDoc(docEv);
        }
      }
      status.innerHTML = `<b>fetched</b> ${ev.host || ""} status=${ev.status || "?"}  ${ev.bytes || ""}B`;
      return;
    }
    if (t === "extract_fact") {
      status.innerHTML = `<b>fact</b> ${ev.label} = ${ev.value} ${ev.unit || ""}`;
      const factEv = {type: "fact", doc_id: ev.doc_id, label: ev.label, value: ev.value, unit: ev.unit, char_offset: ev.char_offset};
      addMapFact(factEv);
      // Mark in current doc if applicable: synthesize minimal state so markFactInDoc works
      if (state.currentDocId === ev.doc_id) {
        state.events = state.events || [];
        state.events.push(factEv);
        state.idx = state.events.length;
        markFactInDoc(factEv);
      }
      return;
    }
    if (t === "job_log") {
      status.innerHTML = `<b>log</b> ${ev.msg || ""}`;
      return;
    }
    if (t === "job_error") {
      status.innerHTML = `<b style="color:#ff7a97">error</b> ${ev.phase || ""}: ${ev.message || ""}`;
      return;
    }
    if (t === "job_done") {
      status.innerHTML = `<b>done</b> ${ev.label || ""}  ok=${ev.ok}`;
      document.getElementById("btn-run").disabled = false;
      document.getElementById("btn-run").textContent = "Run";
      stopLive();
      return;
    }
  }

  document.getElementById("btn-run").addEventListener("click", async () => {
    if (liveState.running) return;
    const ticker = document.getElementById("live-ticker").value;
    const mode = document.getElementById("live-mode").value;
    document.getElementById("btn-run").disabled = true;
    document.getElementById("btn-run").textContent = "Running...";
    document.getElementById("doc-text").innerHTML = '<div class="loading">live run starting...</div>';
    mapPane.innerHTML = "";
    for (const k in hostBlocks) delete hostBlocks[k];
    for (const k in state.nodes) delete state.nodes[k];
    state.events = []; state.idx = 0;
    liveState.startedAt = new Date();
    const topTitle = document.getElementById("replay-title");
    topTitle.innerHTML = `<b>Live run started ${fmt(liveState.startedAt.toISOString())} Central</b>. Real network, real timestamps, no replay.`;
    liveState.clockTimer = setInterval(() => {
      if (!liveState.startedAt) return;
      const secs = Math.round((Date.now() - liveState.startedAt.getTime()) / 1000);
      document.getElementById("live-status").textContent = `elapsed ${secs}s`;
    }, 1000);
    // Subscribe to SSE
    try {
      liveState.es = new EventSource("/desk/events");
      // Fire handlers for all event types
      ["hello","heartbeat","job_start","fetch_start","fetch_done","fetch_done_insert","extract_fact","job_log","job_error","job_done"].forEach(t => {
        liveState.es.addEventListener(t, (e) => {
          try { const d = JSON.parse(e.data); d.type = t; liveHandle(d); } catch(err) {}
        });
      });
      liveState.es.onerror = () => { document.getElementById("live-status").textContent = "SSE connection lost"; };
      liveState.running = true;
    } catch (e) { document.getElementById("live-status").textContent = "SSE unavailable"; }
    // POST live run
    try {
      const r = await fetch("/desk/_run/live", {method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify({ticker, mode})});
      if (r.status === 409) {
        const j = await r.json();
        document.getElementById("live-status").textContent = `409: ${j.detail || "another live run is in progress"}`;
        document.getElementById("btn-run").disabled = false;
        document.getElementById("btn-run").textContent = "Run";
        stopLive();
      } else if (!r.ok) {
        document.getElementById("live-status").textContent = `error ${r.status}`;
        document.getElementById("btn-run").disabled = false;
        document.getElementById("btn-run").textContent = "Run";
        stopLive();
      }
    } catch (e) {
      document.getElementById("live-status").textContent = `POST failed: ${e}`;
      document.getElementById("btn-run").disabled = false;
      document.getElementById("btn-run").textContent = "Run";
      stopLive();
    }
  });

  init();
})();
</script>
</body>
</html>
