<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brain 3D | BMG Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="terminal.css">
<style>
/* The Crawler brain in 3D: every company on the brain's map (brain/universe.json) as a dot sized by its latest 10-K
   revenue, grouped by GICS sector and sub-industry, with comp-set lines (brain/comp-sets.json, BMG judgment). The panel
   drills down: all sectors, one sector's sub-industries, one sub-industry's companies; a company opens its report page.
   It reads /api/brain/universe each time the page loads, so a refresh shows what the Crawler has read since. Read only. */
html, body { height: 100%; overflow: hidden; }
#graph { position: fixed; top: var(--top); bottom: var(--tape); left: 0; right: 0; }
#vignette { position: fixed; top: var(--top); bottom: var(--tape); left: 0; right: 0; pointer-events: none; z-index: 1;
  background: radial-gradient(ellipse at 55% 45%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%); }
#scan { position: fixed; top: var(--top); bottom: var(--tape); left: 0; right: 0; pointer-events: none; z-index: 1; opacity: 0.18;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 3px); }
#labels { position: fixed; top: var(--top); bottom: var(--tape); left: 0; right: 0; pointer-events: none; z-index: 2; overflow: hidden; }
.sec-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; text-align: center;
  transform-origin: 50% 100%; will-change: transform; user-select: none; }
.sec-label .nm { display: inline-flex; align-items: center; gap: 8px; font: 700 21px var(--mono); letter-spacing: 0.1em; text-transform: uppercase;
  padding: 4px 12px 5px; background: rgba(0, 0, 0, 0.78); border: 1px solid var(--c); color: #fff; box-shadow: 0 0 22px -6px var(--c); }
.sec-label .nm .cd { font-size: 12px; color: #000; background: var(--c); padding: 1px 5px; letter-spacing: 0.06em; }
.sec-label .ct { display: block; margin-top: 3px; font: 600 12px var(--mono); color: var(--c); text-shadow: 0 0 6px #000; }
.sec-label::after { content: ""; display: block; width: 1px; height: 26px; margin: 2px auto 0; background: linear-gradient(var(--c), transparent); }
.sec-label:hover .nm, .sec-label.on .nm { background: var(--c); color: #000; }
.sub-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; font: 600 12px var(--mono);
  color: #fff; padding: 2px 7px; background: rgba(0, 0, 0, 0.8); border-left: 3px solid var(--c); text-transform: uppercase; letter-spacing: 0.03em; }
.sub-label:hover, .sub-label.on { background: var(--c); color: #000; }
.co-label { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; white-space: nowrap; font: 700 11px var(--mono);
  color: var(--amber2); text-shadow: 0 0 4px #000, 0 0 2px #000; }
.co-label:hover { color: #fff; }

#panel { position: fixed; top: calc(var(--top) + 10px); left: 10px; bottom: calc(var(--tape) + 10px); z-index: 5; width: 360px;
  display: flex; flex-direction: column; background: rgba(4, 6, 9, 0.92); border: 1px solid var(--line2); }
#panel .ph { flex: none; }
#stats { padding: 6px 10px; font: 11.5px var(--mono); color: var(--mute); border-bottom: 1px solid var(--line); }
#stats b { color: var(--amber2); font-weight: 600; }
.find { padding: 8px 10px 0; position: relative; }
#hits { position: absolute; left: 10px; right: 10px; z-index: 6; list-style: none; margin: 2px 0 0; padding: 0; background: #000; border: 1px solid var(--line2); }
#hits:empty { display: none; }
#hits button { width: 100%; text-align: left; background: none; border: 0; color: var(--ink); padding: 6px 8px; cursor: pointer; font: 13px var(--sans); }
#hits button:hover, #hits button:focus { background: #131a24; outline: none; }
#hits b { font-family: var(--mono); margin-right: 6px; }
.crumb { display: flex; align-items: center; gap: 6px; padding: 8px 10px; font: 600 11.5px var(--mono); text-transform: uppercase; letter-spacing: 0.04em;
  border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.crumb button.up { background: var(--amber); color: #000; border: 0; font: 700 13px var(--mono); padding: 2px 8px; cursor: pointer; }
.crumb button.up:disabled { background: var(--line2); color: var(--dim); cursor: default; }
.crumb a { color: var(--mute); text-decoration: none; cursor: pointer; } .crumb a:hover { color: var(--amber); }
.crumb .cur { color: var(--amber); }
#list { flex: 1; overflow: auto; }
#list table.t td { padding: 6px 8px; }
#list .sw { display: inline-block; width: 9px; height: 9px; margin-right: 7px; vertical-align: 0; }
#list .cd { font: 600 10px var(--mono); color: #000; padding: 0 4px; margin-right: 6px; }
#list .big { padding: 8px 10px; font-size: 12px; color: var(--mute); border-bottom: 1px solid var(--line); line-height: 1.5; }
#list .big b { color: var(--ink); font-family: var(--mono); }
#list .er-list { padding: 4px 10px 10px; }
#list .er-day { font: 600 11px var(--mono); color: var(--amber); margin: 10px 0 4px; }
.ctl { flex: none; display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; border-top: 1px solid var(--line); }
.ctl .btn { font-size: 11px; padding: 4px 8px; }
#key { flex: none; padding: 0 10px 8px; font-size: 11px; color: var(--dim); line-height: 1.45; }

#card { position: fixed; top: calc(var(--top) + 10px); right: 10px; z-index: 5; width: 320px; max-height: calc(100% - var(--top) - var(--tape) - 20px);
  overflow: auto; background: rgba(4, 6, 9, 0.94); border: 1px solid var(--line2); }
#card[hidden] { display: none; }
#card .x { float: right; background: none; border: 0; color: #000; font-size: 18px; cursor: pointer; line-height: 1; }
#card .tk { font: 700 26px var(--mono); }
#card .nm { font-size: 14px; margin-top: 2px; }
#card .where { margin: 6px 0; font: 11.5px var(--mono); color: var(--mute); }
#card .row { display: flex; justify-content: space-between; font: 13px var(--mono); padding: 4px 0; border-bottom: 1px solid var(--line); }
#card .row span:first-child { color: var(--mute); }
#card h3 { margin: 12px 0 5px; font: 600 11px var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--amber); }
#card .chips { display: flex; flex-wrap: wrap; gap: 4px; }
#card .acts { display: grid; gap: 6px; margin-top: 12px; }
#card .acts .btn { text-align: center; }
#card .acts .btn.main { background: var(--amber); color: #000; border-color: var(--amber); font-weight: 700; }
#help { position: fixed; left: 50%; bottom: calc(var(--tape) + 8px); transform: translateX(-50%); z-index: 4; font: 11px var(--mono); color: var(--dim);
  background: rgba(0, 0, 0, 0.7); padding: 4px 12px; white-space: nowrap; }
#msg { position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; pointer-events: none; }
#msg div { max-width: 460px; padding: 18px 22px; background: #000; border: 1px solid var(--amber); font-size: 15px; line-height: 1.5; pointer-events: auto; }
#msg[hidden] { display: none; }
.tip { font: 12px var(--mono); background: #000; padding: 5px 8px; border: 1px solid var(--amber); color: var(--ink); }
.tip b { color: var(--amber); }
@media (max-width: 760px) {
  #panel { width: auto; right: 10px; bottom: auto; max-height: 48%; }
  #card { top: auto; bottom: calc(var(--tape) + 10px); left: 10px; right: 10px; width: auto; max-height: 40%; }
  .sec-label .nm { font-size: 14px; }
  #help { display: none; }
}
</style>
</head>
<body>
<div id="graph" aria-label="The Crawler brain in 3D: companies grouped by sector and sub-industry, sized by 10-K revenue, lines between comp-set peers"></div>
<div id="vignette"></div><div id="scan"></div>
<div id="labels"></div>

<section id="panel" aria-label="Brain navigator">
  <div class="ph">BMG BRAIN <span class="r">S&amp;P 500 MAP</span></div>
  <div id="stats">Loading the brain...</div>
  <div class="find"><input class="q" id="search" type="search" placeholder="Find a company (ticker or name)" autocomplete="off" aria-label="Find a company"><ul id="hits"></ul></div>
  <div class="crumb" id="crumb"></div>
  <div id="list"></div>
  <div class="ctl">
    <button class="btn" id="b-er" type="button" aria-pressed="false">Earnings</button>
    <button class="btn" id="b-size" type="button" aria-pressed="true" title="Dot size by the latest 10-K revenue">Size: revenue</button>
    <button class="btn" id="b-lines" type="button" aria-pressed="true">Comp lines</button>
    <button class="btn" id="b-read" type="button" aria-pressed="false">Read only</button>
    <button class="btn" id="b-spin" type="button" aria-pressed="true">Spin</button>
  </div>
  <div id="key"></div>
</section>

<aside id="card" hidden aria-live="polite"></aside>
<div id="help">DRAG TO TURN &middot; SCROLL TO ZOOM &middot; CLICK A SECTOR, A SUB-INDUSTRY OR A DOT &middot; REFRESH FOR NEW READS</div>
<div id="msg" hidden><div></div></div>

<script src="vendor/3d-force-graph-1.77.0.min.js"></script>
<script src="shell.js"></script>
<script>
(() => {
"use strict";
const {esc, getJSON, money, pct, cls, nav, tape, quotes, earnings, erLabel} = window.BMG;
// One color per GICS sector, the same as the Obsidian graph (scripts/local/brain_obsidian_graph.py SECTOR_COLORS).
const COLORS = {
  "Information Technology": "#4E79A7", "Health Care": "#59A14F", "Financials": "#F28E2B", "Consumer Discretionary": "#E15759",
  "Communication Services": "#B07AA1", "Industrials": "#76B7B2", "Consumer Staples": "#FF9DA7", "Energy": "#9C755F",
  "Utilities": "#BAB0AC", "Real Estate": "#8CD17D", "Materials": "#D37295",
};
const CODES = {"Information Technology": "INFT", "Health Care": "HLTH", "Financials": "FINL", "Consumer Discretionary": "COND",
  "Communication Services": "COMM", "Industrials": "INDU", "Consumer Staples": "CONS", "Energy": "ENRS", "Utilities": "UTIL",
  "Real Estate": "REAL", "Materials": "MATR"};
const R = 560;
const REDUCE = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = id => document.getElementById(id);
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
const hash = s => { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };
const say = html => { const m = $("msg"); m.firstElementChild.innerHTML = html; m.hidden = !html; };
const H = () => innerHeight - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--top")) - parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--tape"));

nav("brain");
let VISIBLE = () => [];
tape({tickers: () => VISIBLE()});

function sphere(n, r, c) {
  const out = [], g = Math.PI * (3 - Math.sqrt(5));
  for (let i = 0; i < n; i++) {
    const y = n === 1 ? 0 : 1 - (i / (n - 1)) * 2, rad = Math.sqrt(Math.max(0, 1 - y * y)), th = g * i;
    out.push({x: (c ? c.x : 0) + Math.cos(th) * rad * r, y: (c ? c.y : 0) + y * r, z: (c ? c.z : 0) + Math.sin(th) * rad * r});
  }
  return out;
}

async function main() {
  if (typeof ForceGraph3D !== "function") { say("The 3D library did not load (desk/brain/vendor/). Refresh the page."); return; }
  let u;
  try { u = await getJSON("/api/brain/universe"); }
  catch (e) { $("stats").textContent = "No brain to show."; say(`<b>The brain did not load.</b><br>${esc(e.message)}<br><br>This page works on the Crawler on your Mac (localhost), where the vault is.`); return; }
  build(u);
}

function build(u) {
  const sectors = (u.sectors || []).filter(s => (s.sub_industries || []).some(x => (x.companies || []).length));
  const anchors = sphere(sectors.length, R);
  const nodes = [], byId = new Map(), secs = [], subs = [];
  sectors.forEach((s, i) => {
    const A = anchors[i], color = COLORS[s.sector] || "#9D9D9D";
    const subList = s.sub_industries.filter(x => (x.companies || []).length);
    const rs = 34 + 13 * Math.sqrt(subList.length);
    const subPts = sphere(subList.length, subList.length === 1 ? 0 : rs, A);
    const sec = {name: s.sector, slug: s.slug, code: CODES[s.sector] || s.sector.slice(0, 4).toUpperCase(), color, A, rs, count: 0, read: 0, subs: []};
    subList.forEach((x, j) => {
      const P = subPts[j];
      const sub = {name: x.industry, slug: x.slug, sector: sec, P, count: x.companies.length, read: 0, nodes: []};
      sec.subs.push(sub); subs.push(sub);
      x.companies.forEach(c => {
        if (byId.has(c.ticker)) return;
        const b = c.brain || {}, reads = b.reads || 0;
        const n = {id: c.ticker, name: c.name || c.ticker, spx: c.index, sector: sec, sub, color, reads, last: b.last,
                   rev: b.revenue ? b.revenue.value : null, revD: b.revenue ? b.revenue.display : null, revP: b.revenue ? b.revenue.period : null,
                   comps: c.comps || [], by: [], ax: P.x, ay: P.y, az: P.z,
                   x: P.x + (hash(c.ticker) - 0.5) * 30, y: P.y + (hash(c.ticker + "y") - 0.5) * 30, z: P.z + (hash(c.ticker + "z") - 0.5) * 30};
        nodes.push(n); byId.set(n.id, n); sub.nodes.push(n); sec.count++; if (reads) { sec.read++; sub.read++; }
      });
    });
    secs.push(sec);
  });
  const links = [], seen = new Set();
  for (const n of nodes) for (const t of n.comps) {
    const m = byId.get(t); if (!m || m === n) continue;
    m.by.push(n.id);
    const k = n.id < m.id ? n.id + "|" + m.id : m.id + "|" + n.id;
    if (seen.has(k)) continue; seen.add(k);
    links.push({source: n.id, target: m.id, cross: n.sector !== m.sector});
  }
  const nRead = nodes.filter(n => n.reads).length, nRev = nodes.filter(n => n.rev).length;
  $("stats").innerHTML = `<b>${secs.length}</b> SECTORS &middot; <b>${nodes.length}</b> COS &middot; <b>${nRead}</b> READ &middot; <b>${links.length}</b> COMP LINES`;
  const ab = u.about || {}, ua = ab.universe || {}, ca = ab.comp_sets || {};
  $("key").innerHTML = `Dot size: latest 10-K revenue (${nRev} of ${nodes.length} known; unknown are small). Bright: read by the Crawler. Map ${esc(ua.as_of || "?")}: GICS (SECONDARY). Comp sets ${esc(ca.as_of || "?")}: BMG judgment. Prices and report dates: SECONDARY context. Not a source for a figure (M39).`;

  // ------------------------------------------------------------------ view state
  let level = {sec: null, sub: null};
  let focus = null, selected = null, showLines = true, onlyRead = false, sizeRev = true, erOn = false, ER = {by: {}, events: []};
  const lit = n => !focus || focus.nodes.has(n.id);
  const shown = n => !onlyRead || n.reads > 0 || (focus && focus.nodes.has(n.id) && selected);
  const lidOf = l => (typeof l.source === "object" ? l.source.id : l.source) + "|" + (typeof l.target === "object" ? l.target.id : l.target);
  const nodeOf = x => typeof x === "object" ? x : byId.get(x);
  const erSoon = n => ER.by[n.id];
  const val = n => (erOn && erSoon(n)) ? Math.max(4, sizeRev && n.rev ? Math.sqrt(n.rev / 1e9) * 1.15 : 4) : sizeRev ? (n.rev ? Math.max(0.6, Math.min(18, Math.sqrt(n.rev / 1e9) * 1.15)) : 0.55) : (n.reads ? 3 + Math.min(n.reads, 6) : 1.2);
  const color = n => {
    if (n === selected) return "#ffffff";
    if (erOn && erSoon(n)) return lit(n) ? "#ffb000" : "rgba(255,176,0,0.35)";
    if (!lit(n)) return hexA(n.color, erOn ? 0.05 : 0.07);
    if (erOn) return hexA(n.color, 0.22);
    return hexA(n.color, n.reads || focus ? 0.95 : 0.4);
  };

  const el = $("graph");
  const G = ForceGraph3D({controlType: "orbit"})(el)
    .width(innerWidth).height(H())
    .backgroundColor("#020304")
    .showNavInfo(false)
    .nodeId("id")
    .nodeRelSize(3.2)
    .nodeResolution(14)
    .nodeOpacity(1)
    .nodeVal(val)
    .nodeColor(color)
    .nodeVisibility(shown)
    .nodeLabel(n => `<div class="tip"><b>${esc(n.id)}</b> ${esc(n.name)}<br>${esc(n.sub.name)}<br>${n.revD ? `10-K revenue ${esc(n.revD)}` : "Revenue not read yet"}${erSoon(n) ? `<br>REPORTS ${esc(erLabel(erSoon(n)))}` : ""}</div>`)
    .linkVisibility(l => showLines && (!focus || focus.links.has(lidOf(l))) && shown(nodeOf(l.source)) && shown(nodeOf(l.target)))
    .linkColor(l => { const s = nodeOf(l.source); if (focus) return hexA(s.color, selected ? 0.9 : 0.5); return l.cross ? "rgba(170,185,215,0.06)" : hexA(s.color, 0.15); })
    .linkOpacity(1)
    .linkWidth(() => (focus && selected) ? 0.9 : 0)
    .linkDirectionalParticles(() => (focus && selected) ? 3 : 0)
    .linkDirectionalParticleWidth(1.8)
    .linkDirectionalParticleSpeed(0.007)
    .linkDirectionalParticleColor(() => "#ffb000")
    .onNodeClick(n => select(n))
    .onBackgroundClick(() => select(null))
    .onNodeHover(n => { el.style.cursor = n ? "pointer" : ""; })
    .warmupTicks(140)
    .cooldownTicks(300)
    .d3AlphaDecay(0.028)
    .graphData({nodes, links});
  G.d3Force("center", null);
  G.d3Force("charge").strength(-10).distanceMax(160);
  G.d3Force("link").distance(l => l.cross ? 200 : 30).strength(l => l.cross ? 0.002 : 0.02);
  G.d3Force("cluster", alpha => { const k = 0.3 * alpha; for (const n of nodes) { n.vx += (n.ax - n.x) * k; n.vy += (n.ay - n.y) * k; n.vz += (n.az - n.z) * k; } });
  const restyle = () => G.nodeVal(G.nodeVal()).nodeColor(G.nodeColor()).nodeVisibility(G.nodeVisibility()).linkVisibility(G.linkVisibility())
    .linkColor(G.linkColor()).linkWidth(G.linkWidth()).linkDirectionalParticles(G.linkDirectionalParticles());
  const wide = () => innerWidth > 900;
  const homeLook = () => ({x: wide() ? -R * 0.3 : 0, y: 0, z: 0});
  const home = {x: 0, y: R * 0.35, z: R * 2.9};
  G.cameraPosition(home, homeLook(), 0);
  const ctl = G.controls();
  let spin = !REDUCE;
  ctl.autoRotate = spin; ctl.autoRotateSpeed = 0.5; ctl.enableDamping = true; ctl.dampingFactor = 0.08;
  const setSpin = v => { spin = v; ctl.autoRotate = v; $("b-spin").setAttribute("aria-pressed", String(v)); };
  setSpin(spin);
  el.addEventListener("pointerdown", () => { if (spin) setSpin(false); });
  el.addEventListener("wheel", () => { if (spin) setSpin(false); }, {passive: true});
  const fly = (to, look, ms) => G.cameraPosition(to, look, REDUCE ? 0 : ms);

  // ------------------------------------------------------------------ labels over the clusters
  const lab = $("labels");
  for (const s of secs) {
    s.el = document.createElement("div");
    s.el.className = "sec-label"; s.el.style.setProperty("--c", s.color);
    s.el.innerHTML = `<span class="nm"><span class="cd">${esc(s.code)}</span>${esc(s.name)}</span><span class="ct">${s.count} COS &middot; ${s.read} READ</span>`;
    s.el.title = `Open ${s.name}`;
    s.el.addEventListener("click", e => { e.stopPropagation(); go(s, null, true); });
    s.L = {x: s.A.x, y: s.A.y + s.rs + 70, z: s.A.z};
    lab.appendChild(s.el);
  }
  for (const x of subs) {
    x.el = document.createElement("div");
    x.el.className = "sub-label"; x.el.style.setProperty("--c", x.sector.color);
    x.el.textContent = `${x.name} (${x.count})`; x.el.style.display = "none";
    x.el.addEventListener("click", e => { e.stopPropagation(); go(x.sector, x, true); });
    x.L = {x: x.P.x, y: x.P.y + 26, z: x.P.z};
    lab.appendChild(x.el);
  }
  let coLabels = [];
  function companyLabels(list) {
    for (const c of coLabels) c.el.remove();
    coLabels = list.map(n => { const d = document.createElement("div"); d.className = "co-label"; d.textContent = n.id;
      d.addEventListener("click", e => { e.stopPropagation(); select(n); }); lab.appendChild(d); return {n, el: d}; });
  }
  function put(el_, p0, minS, maxS, k) {
    const cam = G.camera(), e = cam.matrixWorldInverse.elements;
    const zc = e[2] * p0.x + e[6] * p0.y + e[10] * p0.z + e[14];
    if (zc > -20) { el_.style.visibility = "hidden"; return 0; }
    const d = -zc, p = G.graph2ScreenCoords(p0.x, p0.y, p0.z), sc = Math.max(minS, Math.min(maxS, k / d));
    el_.style.visibility = "visible";
    el_.style.transform = `translate(${p.x.toFixed(1)}px,${p.y.toFixed(1)}px) translate(-50%,-100%) scale(${sc.toFixed(3)})`;
    el_.style.zIndex = String(100000 - Math.round(d));
    return d;
  }
  let tick = 0;
  function centers() {
    for (const g of [...secs, ...subs]) { g._n = 0; g._x = g._y = g._z = g._yy = 0; }
    for (const n of nodes) for (const g of [n.sector, n.sub]) { g._n++; g._x += n.x; g._y += n.y; g._z += n.z; g._yy += n.y * n.y; }
    const at = (g, lift) => { const my = g._y / g._n, sd = Math.sqrt(Math.max(0, g._yy / g._n - my * my)); return {x: g._x / g._n, y: my + 1.3 * sd + lift, z: g._z / g._n, cy: my}; };
    for (const s of secs) if (s._n) s.L = at(s, 30);
    for (const x of subs) if (x._n) x.L = at(x, 10);
  }
  (function frame() {
    if (tick++ % 8 === 0) centers();
    for (const s of secs) {
      const d = put(s.el, s.L, 0.5, 1.5, 1300);
      if (d) s.el.style.opacity = level.sec ? (level.sec === s ? "1" : "0.18") : (selected && selected.sector !== s ? "0.18" : "1");
    }
    for (const x of subs) if (x.el.style.display !== "none") put(x.el, x.L, 0.7, 1.25, 700);
    for (const c of coLabels) put(c.el, {x: c.n.x, y: c.n.y + 8, z: c.n.z}, 0.75, 1.2, 500);
    requestAnimationFrame(frame);
  })();

  // ------------------------------------------------------------------ drill-down: all sectors > sector > sub-industry
  function focusOn(list) {
    const ids = new Set(list.map(n => n.id));
    focus = list.length ? {nodes: ids, links: new Set(links.filter(l => ids.has(nodeOf(l.source).id) && ids.has(nodeOf(l.target).id)).map(lidOf))} : null;
  }
  function go(sec, sub, move, keepSel) {
    level = {sec: sec || null, sub: sub || null};
    if (!keepSel) { selected = null; $("card").hidden = true; }
    for (const s of secs) s.el.classList.toggle("on", s === sec);
    for (const x of subs) { x.el.style.display = sec && x.sector === sec && (!sub || x === sub) ? "" : "none"; x.el.classList.toggle("on", x === sub); }
    companyLabels(sub ? sub.nodes : []);
    if (!keepSel) { if (sub) focusOn(sub.nodes); else if (sec) focusOn(nodes.filter(n => n.sector === sec)); else focus = null; restyle(); }
    if (move) {
      setSpin(false);
      if (sub) { const c = sub.L && sub._n ? {x: sub._x / sub._n, y: sub._y / sub._n, z: sub._z / sub._n} : sub.P;
        const d = Math.hypot(c.x, c.y, c.z) || 1, f = 1 + 230 / d; fly({x: c.x * f, y: c.y * f + 30, z: c.z * f}, c, 1100); }
      else if (sec) { const f = 1 + (sec.rs + 260) / R; fly({x: sec.A.x * f, y: sec.A.y * f + 40, z: sec.A.z * f}, sec.A, 1100); }
      else fly(home, homeLook(), 1100);
    }
    const qs = new URLSearchParams();
    if (sec) qs.set("sector", sec.slug); if (sub) qs.set("sub", sub.slug);
    history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs : ""));
    panel();
  }
  function up() { if (level.sub) go(level.sec, null, true); else if (level.sec) go(null, null, true); }

  function erBadge(n) { const e = erSoon(n); return e ? `<span class="badge">${esc(erLabel(e))}</span>` : ""; }
  async function panel() {
    const {sec, sub} = level;
    $("crumb").innerHTML = `<button class="up" type="button" id="up" ${sec ? "" : "disabled"} aria-label="Back one level" title="Back one level">&larr;</button>` +
      (sec ? `<a data-l="all">All sectors</a> &rsaquo; ` : `<span class="cur">All sectors</span>`) +
      (sec ? (sub ? `<a data-l="sec">${esc(sec.name)}</a> &rsaquo; <span class="cur">${esc(sub.name)}</span>` : `<span class="cur">${esc(sec.name)}</span>`) : "");
    $("up").onclick = up;
    $("crumb").querySelectorAll("a").forEach(a => a.onclick = () => a.dataset.l === "all" ? go(null, null, true) : go(sec, null, true));
    const L = $("list");
    const erCount = list => list.filter(n => erSoon(n)).length;
    if (!sec) {
      L.innerHTML = `<table class="t"><thead><tr><th>Sector</th><th class="n">Cos</th><th class="n">Read</th><th class="n">ER 14d</th></tr></thead><tbody>${
        [...secs].sort((a, b) => b.count - a.count).map(s => `<tr class="click" data-s="${esc(s.slug)}"><td><span class="cd" style="background:${s.color}">${esc(s.code)}</span>${esc(s.name)}</td><td class="n">${s.count}</td><td class="n">${s.read}</td><td class="n">${erCount(nodes.filter(n => n.sector === s)) || ""}</td></tr>`).join("")}</tbody></table>` +
        (erOn ? erList(nodes) : "");
      L.querySelectorAll("tr[data-s]").forEach(tr => tr.onclick = () => go(secs.find(s => s.slug === tr.dataset.s), null, true));
      VISIBLE = () => [];
    } else if (!sub) {
      const sn = nodes.filter(n => n.sector === sec), top = sn.filter(n => n.rev).sort((a, b) => b.rev - a.rev).slice(0, 4);
      L.innerHTML = `<div class="big"><b>${sec.count}</b> companies, <b>${sec.read}</b> read, <b>${sec.subs.length}</b> sub-industries.${top.length ? `<br>Largest by 10-K revenue: ${top.map(n => `<b>${esc(n.id)}</b> ${esc(n.revD)}`).join(", ")}` : ""}</div>` +
        `<table class="t"><thead><tr><th>Sub-industry</th><th class="n">Cos</th><th class="n">Read</th><th class="n">ER</th></tr></thead><tbody>${
        [...sec.subs].sort((a, b) => b.count - a.count).map(x => `<tr class="click" data-x="${esc(x.slug)}"><td>${esc(x.name)}</td><td class="n">${x.count}</td><td class="n">${x.read}</td><td class="n">${erCount(x.nodes) || ""}</td></tr>`).join("")}</tbody></table>` +
        (erOn ? erList(sn) : "");
      L.querySelectorAll("tr[data-x]").forEach(tr => tr.onclick = () => go(sec, sec.subs.find(x => x.slug === tr.dataset.x), true));
      VISIBLE = () => top.map(n => n.id);
    } else {
      const list = [...sub.nodes].sort((a, b) => (b.rev || 0) - (a.rev || 0) || a.id.localeCompare(b.id));
      L.innerHTML = `<table class="t"><thead><tr><th>Company</th><th class="n">10-K rev</th><th class="n">Last</th><th class="n">Day</th></tr></thead><tbody>${
        list.map(n => `<tr class="click" data-t="${esc(n.id)}" title="Open ${esc(n.id)}'s report"><td><b class="amber num">${esc(n.id)}</b> ${erBadge(n)}<div class="mute" style="font-size:11.5px">${esc(n.name)}${n.reads ? "" : " (not read)"}</div></td>
          <td class="n">${esc(n.revD || "")}</td><td class="n" data-px="${esc(n.id)}"></td><td class="n" data-ch="${esc(n.id)}"></td></tr>`).join("")}</tbody></table>
        <div class="big">Click a company for its report. Its comps are in the report, or click its dot.</div>`;
      L.querySelectorAll("tr[data-t]").forEach(tr => {
        tr.onclick = () => { location.href = `company/?t=${encodeURIComponent(tr.dataset.t)}`; };
        tr.onmouseenter = () => { const n = byId.get(tr.dataset.t); if (n && !selected) { focusOn([n, ...n.comps.map(t => byId.get(t)).filter(Boolean)]); restyle(); } };
        tr.onmouseleave = () => { if (!selected) { focusOn(sub.nodes); restyle(); } };
      });
      VISIBLE = () => list.slice(0, 40).map(n => n.id);
      const q = await quotes(list.slice(0, 60).map(n => n.id));
      for (const n of list) { const x = q[n.id]; if (!x) continue;
        const a = L.querySelector(`[data-px="${CSS.escape(n.id)}"]`), b = L.querySelector(`[data-ch="${CSS.escape(n.id)}"]`);
        if (a) a.textContent = x.price.toFixed(2); if (b) { b.textContent = pct(x.change_pct); b.className = "n " + cls(x.change_pct); } }
    }
  }
  function erList(scope) {
    const ids = new Set(scope.map(n => n.id)), ev = (ER.events || []).filter(e => ids.has(e.ticker));
    if (!ev.length) return `<div class="big">${ER.error ? esc(ER.error) : "No company here reports in the next 14 days" + (ER.source ? ` (${esc(ER.source)})` : "")}.</div>`;
    let day = "", out = `<div class="er-list">`;
    for (const e of ev) { const n = byId.get(e.ticker);
      if (e.date !== day) { day = e.date; out += `<div class="er-day">${esc(erLabel({date: e.date}))}</div>`; }
      out += `<a class="chip" style="margin:0 4px 4px 0;border-color:${n ? n.color : ""}" href="company/?t=${encodeURIComponent(e.ticker)}" title="${esc(n ? n.name : "")}">${esc(e.ticker)}${e.hour === "before open" ? " BMO" : e.hour === "after close" ? " AMC" : ""}</a>`; }
    return out + `</div><div class="big">${esc(ER.note || "")}</div>`;
  }

  // ------------------------------------------------------------------ a dot clicked: its card
  function select(n, fromSearch) {
    selected = n || null;
    if (!n) { $("card").hidden = true; go(level.sec, level.sub, false); return; }
    setSpin(false);
    const near = new Set([n.id, ...n.comps.filter(t => byId.has(t)), ...n.by]);
    focus = {nodes: near, links: new Set(links.filter(l => nodeOf(l.source).id === n.id || nodeOf(l.target).id === n.id).map(lidOf))};
    restyle();
    const d = Math.hypot(n.x, n.y, n.z) || 1, f = 1 + 300 / d;
    fly({x: n.x * f, y: n.y * f, z: n.z * f}, {x: n.x, y: n.y, z: n.z}, fromSearch ? 1300 : 900);
    card(n);
  }
  const chip = t => { const m = byId.get(t); return m ? `<button type="button" class="chip" style="border-color:${m.color}" data-t="${esc(t)}" title="${esc(m.name)}">${esc(t)}</button>` : `<span class="chip off" title="Not on the map">${esc(t)}</span>`; };
  async function card(n) {
    const c = $("card"), e = erSoon(n);
    c.innerHTML = `<div class="ph">${esc(n.sector.code)} &middot; COMPANY <button class="x" type="button" aria-label="Close">&times;</button></div><div class="pb">
      <div class="tk" style="color:${n.color}">${esc(n.id)}</div><div class="nm">${esc(n.name)}</div>
      <div class="where">${esc(n.sector.name)} &rsaquo; ${esc(n.sub.name)}${n.spx ? ` (${esc(n.spx)})` : ""}</div>
      <div class="row"><span>10-K REVENUE</span><span>${n.revD ? `${esc(n.revD)} <span class="mute">FY ${esc((n.revP || "").slice(0, 4))}</span>` : "not read"}</span></div>
      <div class="row"><span>LAST</span><span id="c-px" class="num">...</span></div>
      <div class="row"><span>READ</span><span>${n.reads ? `${n.reads}x, last ${esc((n.last || {}).form || "")}` : "not yet"}</span></div>
      ${e ? `<div class="row"><span>REPORTS</span><span class="amber">${esc(erLabel(e))}</span></div>` : ""}
      <h3>Comp set (BMG judgment)</h3><div class="chips">${n.comps.map(chip).join("") || '<span class="mute">None on file.</span>'}</div>
      ${n.by.length ? `<h3>In the comp set of</h3><div class="chips">${n.by.map(chip).join("")}</div>` : ""}
      <div class="acts"><a class="btn main" href="company/?t=${encodeURIComponent(n.id)}">Open report &rsaquo;</a>
        <a class="btn" href="mastermind/?t=${encodeURIComponent(n.id)}">Ask Mastermind about ${esc(n.id)}</a>
        <button class="btn" type="button" id="c-sub">Show ${esc(n.sub.name)}</button></div></div>`;
    c.hidden = false;
    c.querySelector(".x").onclick = () => select(null);
    c.querySelectorAll("button.chip").forEach(b => b.onclick = () => select(byId.get(b.dataset.t)));
    $("c-sub").onclick = () => go(n.sector, n.sub, true);
    const q = await quotes([n.id]), x = q[n.id];
    const px = $("c-px"); if (px) px.innerHTML = x ? `${x.price.toFixed(2)} <span class="${cls(x.change_pct)}">${pct(x.change_pct)}</span>` : "n/a";
  }

  // ------------------------------------------------------------------ search, buttons, keys
  const q = $("search"), hits = $("hits");
  const find = s => { s = s.trim().toLowerCase(); if (!s) return [];
    const ex = nodes.filter(n => n.id.toLowerCase() === s);
    return ex.concat(nodes.filter(n => !ex.includes(n) && (n.id.toLowerCase().startsWith(s) || n.name.toLowerCase().includes(s)))).slice(0, 7); };
  const pick = n => { hits.innerHTML = ""; q.value = n.id; go(n.sector, n.sub, false, true); select(n, true); };
  q.addEventListener("input", () => {
    hits.innerHTML = find(q.value).map(n => `<li><button type="button" data-t="${esc(n.id)}"><b style="color:${n.color}">${esc(n.id)}</b>${esc(n.name)}</button></li>`).join("");
    hits.querySelectorAll("button").forEach(b => b.onclick = () => pick(byId.get(b.dataset.t)));
  });
  q.addEventListener("keydown", e => {
    if (e.key === "Enter") { const f = find(q.value)[0]; if (f) pick(f); }
    if (e.key === "ArrowDown") { const f = hits.querySelector("button"); if (f) { e.preventDefault(); f.focus(); } }
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") { if (selected) select(null); else up(); hits.innerHTML = ""; }
    if (e.key === "Backspace" && document.activeElement === document.body) { e.preventDefault(); up(); }
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  });
  $("b-spin").onclick = () => setSpin(!spin);
  $("b-lines").onclick = () => { showLines = !showLines; $("b-lines").setAttribute("aria-pressed", String(showLines)); restyle(); };
  $("b-read").onclick = () => { onlyRead = !onlyRead; $("b-read").setAttribute("aria-pressed", String(onlyRead)); restyle(); };
  $("b-size").onclick = () => { sizeRev = !sizeRev; $("b-size").setAttribute("aria-pressed", String(sizeRev)); $("b-size").textContent = sizeRev ? "Size: revenue" : "Size: reads"; restyle(); };
  $("b-er").onclick = async () => {
    erOn = !erOn; $("b-er").setAttribute("aria-pressed", String(erOn));
    if (erOn && !(ER.events || []).length) { $("b-er").textContent = "Earnings..."; ER = await earnings(14); $("b-er").textContent = "Earnings"; }
    restyle(); panel();
  };
  window.addEventListener("resize", () => G.width(innerWidth).height(H()));
  earnings(14).then(e => { ER = e; panel(); });

  // ?sector=financials&sub=consumer-finance opens a level; ?t=AXP a company (links from the report page and for videos)
  const qs = new URLSearchParams(location.search);
  const s0 = secs.find(s => s.slug === (qs.get("sector") || "").toLowerCase());
  const x0 = s0 && s0.subs.find(x => x.slug === (qs.get("sub") || "").toLowerCase());
  const t0 = byId.get((qs.get("t") || "").toUpperCase());
  panel();
  setTimeout(() => { if (t0) pick(t0); else if (s0) go(s0, x0 || null, true); }, 1200);
  window.__brain3d = {nodes: nodes.length, read: nRead, revenue: nRev, links: links.length,
    sectors: secs.map(s => ({name: s.name, count: s.count, read: s.read, subs: s.subs.length})),
    level: () => ({sector: level.sec && level.sec.name, sub: level.sub && level.sub.name}), go: (s, x) => go(secs.find(a => a.slug === s) || null, null, true), select: t => pick(byId.get(t)), graph: G};
}

main();
})();
</script>
</body>
</html>
