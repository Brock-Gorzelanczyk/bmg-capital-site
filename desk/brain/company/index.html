<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company | BMG Capital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../terminal.css">
<style>
/* One company, everything about it on one page (Brock, 2026-11-10: "when I type in NVIDIA, boom, we're getting
   everything about NVIDIA"). Top to bottom: the price and a simple chart; About (chief executive, founded, employees,
   headquarters, what it does); the day's key statistics; then what the Crawler's brain holds: the takeaways of its
   annual filing, the figures by year and by quarter, balance sheet, guidance, the quality scores and red-flag checks,
   risks, the comp set, the filings read. Every figure from a filing keeps its page, and the page opens in the Crawler
   when this computer has the saved read. Prices are SECONDARY context. The page reads; its one request that is not a
   read asks the Crawler itself to read the company's 10-K (the brain's only writer). */
:root { --card: #0a0d12; --card2: #10151c; --hair: #1b222d; --hair2: #263040; --text: #eef1f5; --soft: #aab3c2; --faint: #6f7a8c; --up: #2fd36b; --dn: #ff5a52; --rad: 14px; }
html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top) + 64px); }
body { padding: var(--top) 0 calc(var(--tape) + 48px); font: 15px/1.5 var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
a { color: var(--amber2); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: 22px; padding-right: 22px; }
.tnum { font-variant-numeric: tabular-nums; }

/* the bar under the top bar: who this is (once the price has scrolled away), the sections, the search */
.bar { position: sticky; top: var(--top); z-index: 30; background: rgba(2, 3, 4, 0.9); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--hair); }
.bar .wrap { display: flex; align-items: center; gap: 14px; height: 54px; }
.mini { display: none; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
.bar.past .mini { display: flex; }
.mini .mp { color: var(--soft); font-weight: 500; }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.tabs::-webkit-scrollbar { display: none; }
.tabs.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 30px), transparent); }
.tabs a { padding: 6px 11px; border-radius: 999px; color: var(--soft); text-decoration: none; font-size: 13.5px; white-space: nowrap; }
.tabs a:hover { color: var(--text); background: var(--card2); }
.tabs a.on { color: #000; background: var(--text); }
.tabs a[hidden] { display: none; }
.find { position: relative; flex: none; width: 250px; }
.find input { width: 100%; height: 36px; padding: 0 12px 0 34px; border-radius: 999px; border: 1px solid var(--hair2); background: var(--card); color: var(--text); font: 14px var(--sans); outline: none; }
.find input:focus { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255, 176, 0, 0.16); }
.find input::placeholder { color: var(--faint); }
.find svg { position: absolute; left: 12px; top: 10px; width: 16px; height: 16px; stroke: var(--faint); fill: none; stroke-width: 2; pointer-events: none; }
.find ul { position: absolute; top: 42px; left: 0; right: 0; margin: 0; padding: 6px; list-style: none; background: var(--card2); border: 1px solid var(--hair2); border-radius: 12px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6); max-height: 340px; overflow: auto; }
.find ul:empty { display: none; }
.find li a { display: flex; gap: 10px; align-items: baseline; padding: 7px 9px; border-radius: 8px; color: var(--text); text-decoration: none; }
.find li a:hover, .find li a.sel { background: #1a2230; }
.find li b { font-weight: 600; min-width: 52px; }
.find li span { color: var(--soft); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* the top of the page: name, price, chart */
.hero { padding-top: 26px; }
.who { display: flex; align-items: center; gap: 14px; }
.clogo { width: 52px; height: 52px; border-radius: 12px; background: #fff; display: grid; place-items: center; overflow: hidden; flex: none; font: 700 20px var(--sans); color: #000; }
.clogo img { width: 100%; height: 100%; object-fit: contain; padding: 6px; }
.clogo.none { background: var(--card2); color: var(--text); border: 1px solid var(--hair2); }
h1 { margin: 0; font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.01em; }
.sub { color: var(--soft); font-size: 14px; margin-top: 3px; }
.sub a { color: var(--soft); text-decoration: none; border-bottom: 1px dotted var(--faint); } .sub a:hover { color: var(--text); }
.sub .tag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px; background: rgba(255, 176, 0, 0.14); color: var(--amber2); font-size: 12px; font-weight: 600; }
.px { margin-top: 18px; font-size: 46px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; min-height: 49px; }
.chg { margin-top: 6px; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 22px; }
.chg .when { color: var(--soft); font-weight: 500; margin-left: 6px; }
.up { color: var(--up); } .down { color: var(--dn); }
.chart { position: relative; height: 300px; margin-top: 10px; touch-action: pan-y; cursor: crosshair; user-select: none; }
.chart svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .base { stroke: var(--faint); stroke-width: 1; stroke-dasharray: 1 5; stroke-linecap: round; }
.chart .cur { stroke: var(--soft); stroke-width: 1; }
.chart .stamp { position: absolute; top: -4px; transform: translateX(-50%); color: var(--soft); font-size: 12.5px; white-space: nowrap; pointer-events: none; font-variant-numeric: tabular-nums; }
.chart .note { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--soft); padding: 20px; cursor: default; }
.chart.busy svg { opacity: 0.35; transition: opacity 0.15s; }
.ranges { display: flex; gap: 4px; margin-top: 10px; padding-bottom: 14px; border-bottom: 1px solid var(--hair); flex-wrap: wrap; align-items: center; }
.ranges button { background: none; border: 0; color: var(--text); font: 600 13.5px var(--sans); padding: 6px 12px; border-radius: 8px; cursor: pointer; }
.ranges button:hover { color: var(--c, var(--up)); }
.ranges button[aria-pressed="true"] { background: var(--c, var(--text)); color: #000; }
.ranges .src { margin-left: auto; color: var(--faint); font-size: 12px; }

/* sections */
.sec { padding-top: 34px; }
.sec > h2 { margin: 0 0 14px; font-size: 21px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec > h2 small { font-size: 13px; font-weight: 400; color: var(--soft); }
.card { background: var(--card); border: 1px solid var(--hair); border-radius: var(--rad); padding: 18px 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid2 > * { min-width: 0; }
.lead { font-size: 16px; line-height: 1.6; color: #dfe4eb; margin: 0; max-width: 78ch; }
.lead.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.more { background: none; border: 0; padding: 0; margin-top: 6px; color: var(--amber2); font: 600 14px var(--sans); cursor: pointer; }
.wiki { margin: 12px 0 0; color: var(--soft); font-size: 14.5px; line-height: 1.6; max-width: 78ch; }
.facts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; margin-top: 18px; border-top: 1px solid var(--hair); }
.fact { padding: 14px 16px 12px 0; border-bottom: 1px solid var(--hair); min-width: 0; }
.fact .k { color: var(--soft); font-size: 13px; font-weight: 600; }
.fact .v { margin-top: 3px; font-size: 16px; font-weight: 500; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.fact .v.na { color: var(--faint); font-weight: 400; }
.fact .v a { color: var(--text); }
.fact .s { margin-top: 3px; font-size: 12px; color: var(--faint); }
.cite { color: var(--faint); font-size: 12px; text-decoration: none; white-space: nowrap; border-bottom: 1px dotted transparent; }
a.cite:hover { color: var(--amber2); border-bottom-color: var(--amber2); }
.sec2 { display: inline-block; margin-left: 5px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--hair2); color: var(--faint); font-size: 10.5px; letter-spacing: 0.04em; vertical-align: 1px; }
.range52 { grid-column: 1 / -1; padding: 16px 0 14px; border-bottom: 1px solid var(--hair); }
.range52 .rail { position: relative; height: 4px; border-radius: 2px; background: var(--hair2); margin: 10px 0 6px; }
.range52 .rail i { position: absolute; top: -4px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: var(--text); box-shadow: 0 0 0 3px var(--bg); }
.range52 .ends { display: flex; justify-content: space-between; font-size: 13px; color: var(--soft); font-variant-numeric: tabular-nums; }
.note { color: var(--faint); font-size: 12.5px; line-height: 1.5; margin: 10px 0 0; }
.skel { display: inline-block; height: 1em; width: 7em; border-radius: 6px; background: linear-gradient(90deg, #131922 0%, #1c2430 50%, #131922 100%); background-size: 200% 100%; animation: sk 1.2s linear infinite; vertical-align: middle; }
@keyframes sk { to { background-position: -200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel { animation: none; } html { scroll-behavior: auto; } }

/* what the Crawler found */
.headline { font-size: 19px; line-height: 1.45; font-weight: 500; margin: 0 0 14px; max-width: 70ch; }
.takes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.take { background: var(--card); border: 1px solid var(--hair); border-left: 3px solid var(--hair2); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.take.pos { border-left-color: var(--up); } .take.neg { border-left-color: var(--dn); }
.take b { display: block; font-size: 15.5px; font-weight: 600; }
.take p { margin: 6px 0 0; color: #cfd5de; font-size: 14.5px; line-height: 1.5; }
.take .w { color: var(--soft); font-size: 13.5px; }
.empty { background: var(--card); border: 1px dashed var(--hair2); border-radius: var(--rad); padding: 22px; color: var(--soft); }
.empty b { color: var(--text); font-size: 16px; display: block; margin-bottom: 4px; }
.act { display: inline-flex; align-items: center; gap: 6px; margin: 12px 8px 0 0; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--hair2); background: var(--card2); color: var(--text); font: 600 13.5px var(--sans); text-decoration: none; cursor: pointer; }
.act:hover { border-color: var(--amber); color: var(--amber2); }
.act.main { background: var(--amber); border-color: var(--amber); color: #000; } .act.main:hover { background: var(--amber2); color: #000; }
.act[disabled] { opacity: 0.6; cursor: default; }
.acts { display: flex; flex-wrap: wrap; gap: 0; margin-top: 4px; }

/* financials */
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pills button { background: var(--card2); border: 1px solid var(--hair2); color: var(--soft); font: 500 13.5px var(--sans); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.pills button:hover { color: var(--text); }
.pills button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: #000; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--hair2); border-radius: 999px; padding: 2px; background: var(--card); }
.seg button { background: none; border: 0; color: var(--soft); font: 500 13px var(--sans); padding: 5px 12px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--card2); color: var(--text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--hair2); }
.seg button[disabled] { opacity: 0.4; cursor: default; }
.finhead { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.finhead .sp { flex: 1; }
.bars { height: 250px; margin-top: 8px; }
.bars svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bars .v { fill: var(--text); font: 600 13px var(--sans); font-variant-numeric: tabular-nums; }
.bars .p { fill: var(--soft); font: 12.5px var(--sans); }
.bars .g { font: 600 12px var(--sans); }
.bars a { cursor: pointer; } .bars a:hover rect { opacity: 1; }
.bars rect { opacity: 0.88; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-weight: 600; font-size: 12.5px; color: var(--soft); padding: 8px 10px; border-bottom: 1px solid var(--hair2); white-space: nowrap; }
.tbl td { padding: 9px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tbl td.n .cite { display: block; }
.tbl td.go { text-align: right; white-space: nowrap; } .tbl td.go .cite { margin-left: 14px; font-size: 13px; color: var(--soft); }
.tbl td.co { min-width: 150px; }
.tbl tr.click { cursor: pointer; } .tbl tr.click:hover td { background: #0f141b; }
.scroll { overflow-x: auto; }
details.fold > summary { cursor: pointer; color: var(--amber2); font-weight: 600; font-size: 14px; list-style: none; margin-top: 14px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold[open] > summary { margin-bottom: 10px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--card); border: 1px solid var(--hair); border-radius: 12px; padding: 13px 15px; min-width: 0; }
.tile .k { color: var(--soft); font-size: 12.5px; font-weight: 600; }
.tile .v { margin-top: 4px; font-size: 21px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .s { margin-top: 2px; font-size: 12px; color: var(--faint); line-height: 1.45; }
.guide { margin: 0; padding: 0; list-style: none; }
.guide li { padding: 11px 0; border-bottom: 1px solid var(--hair); display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; align-items: baseline; }
.guide li:last-child { border-bottom: 0; }
.guide .tp { color: var(--soft); font-size: 12.5px; font-weight: 600; }
.chip2 { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--card2); border: 1px solid var(--hair2); color: var(--soft); white-space: nowrap; }
.chip2.rd { background: rgba(255, 90, 82, 0.14); border-color: rgba(255, 90, 82, 0.4); color: #ff8a84; }
.chip2.gr { background: rgba(47, 211, 107, 0.12); border-color: rgba(47, 211, 107, 0.35); color: #6fe39a; }
.chip2.am { background: rgba(255, 176, 0, 0.12); border-color: rgba(255, 176, 0, 0.35); color: var(--amber2); }
.flag { display: grid; grid-template-columns: auto 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hair); align-items: start; }
.flag:last-child { border-bottom: 0; }
.flag q { display: block; margin-top: 3px; color: var(--soft); font-size: 13.5px; quotes: none; }
.tk { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--hair2); background: var(--card2); color: var(--text); font: 600 13px var(--sans); text-decoration: none; margin: 0 6px 6px 0; }
.tk:hover { border-color: var(--amber); color: var(--amber2); }
.peer .t { font-weight: 600; } .peer .nm2 { color: var(--soft); font-size: 13px; }
.cmpbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; color: var(--soft); font-size: 14px; }
.cmpbar select { background: var(--card2); color: var(--text); border: 1px solid var(--hair2); border-radius: 999px; font: 14px var(--sans); padding: 6px 12px; }
.foot { color: var(--faint); font-size: 12.5px; line-height: 1.6; margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--hair); }
.landing { text-align: center; padding: 90px 0 40px; }
.landing h1 { font-size: 34px; }
.landing p { color: var(--soft); max-width: 46ch; margin: 10px auto 22px; }
.landing .find { width: min(520px, 100%); margin: 0 auto; }
.landing .find input { height: 50px; font-size: 17px; padding-left: 44px; }
.landing .find svg { left: 16px; top: 16px; width: 18px; height: 18px; }
.landing .find ul { top: 56px; text-align: left; }
@media (max-width: 900px) {
  .facts, .tiles { grid-template-columns: repeat(2, 1fr); }
  .grid2, .takes { grid-template-columns: 1fr; }
  .find { width: 170px; }
  .px { font-size: 38px; }
  .chart { height: 240px; }
  .guide li { grid-template-columns: 1fr; gap: 2px; }
  .ranges .src { width: 100%; margin: 6px 0 0; }
}
@media (max-width: 560px) { .wrap { padding-left: 14px; padding-right: 14px; } .bar .tabs { display: none; } .find { width: auto; flex: 1; } h1 { font-size: 24px; } .ranges button { padding: 6px 8px; } }
</style>
</head>
<body>
<div class="bar" id="bar"><div class="wrap">
  <div class="mini" id="mini"></div>
  <nav class="tabs" id="tabs" aria-label="Sections of this page">
    <a href="#top" data-s="top">Overview</a><a href="#about" data-s="about">About</a><a href="#stats" data-s="stats">Statistics</a>
    <a href="#found" data-s="found">Crawler's read</a><a href="#fin" data-s="fin">Financials</a><a href="#health" data-s="health">Health</a>
    <a href="#risks" data-s="risks">Risks</a><a href="#peers" data-s="peers">Peers</a><a href="#filings" data-s="filings">Filings</a>
  </nav>
  <div class="find" id="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Search a company or ticker" autocomplete="off" spellcheck="false" aria-label="Search a company or ticker"><ul id="hits"></ul></div>
</div></div>
<main id="main"></main>
<script src="../shell.js"></script>
<script>
(() => {
"use strict";
const {esc, getJSON, money, pct, cls, nav, tape, quotes, earnings, erLabel} = window.BMG;
nav("brain");
const T = (new URLSearchParams(location.search).get("t") || "").trim().toUpperCase().replace(/[^A-Z0-9.\-]/g, "").slice(0, 10);
tape({tickers: () => T ? [T] : []});
const $ = id => document.getElementById(id);
const main = $("main");
const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const RANGES = [["1D", "Today"], ["1W", "Past week"], ["1M", "Past month"], ["3M", "Past 3 months"], ["YTD", "Year to date"], ["1Y", "Past year"], ["5Y", "Past 5 years"], ["MAX", "All time"]];
const S = {report: null, profile: null, snap: null, stats: null, edgar: null, hist: null, quote: null, charts: {}, range: "1D", hover: null, metric: "revenue", span: "FY", src: "brain", srcPick: null, name: T, gone: {}};

// ------------------------------------------------------------------ small helpers
const num = v => typeof v === "number" && isFinite(v);
const usd = (v, d) => num(v) ? "$" + v.toLocaleString("en-US", {minimumFractionDigits: d == null ? 2 : d, maximumFractionDigits: d == null ? 2 : d}) : "";
const signed = v => num(v) ? (v < 0 ? "-" : "+") + usd(Math.abs(v)) : "";
const compact = v => { if (!num(v)) return ""; const a = Math.abs(v);
  return a >= 1e12 ? (v / 1e12).toFixed(2) + "T" : a >= 1e9 ? (v / 1e9).toFixed(2) + "B" : a >= 1e6 ? (v / 1e6).toFixed(2) + "M" : a >= 1e3 ? (v / 1e3).toFixed(1) + "K" : String(Math.round(v)); };
const when = (ms, tz, o) => { try { return new Intl.DateTimeFormat("en-US", Object.assign({timeZone: tz || "America/New_York"}, o)).format(new Date(ms)); } catch (e) { return new Date(ms).toLocaleString("en-US", o); } };
const day = iso => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(String(iso || "")); return m ? `${MON[+m[2] - 1]} ${+m[3]}, ${m[1]}` : String(iso || ""); };
const shortPeriod = s => String(s || "").replace(/^(Fiscal year|Quarter) ended /, "");
const periodWords = (p, end) => /^\d{4}-\d\d-\d\d$/.test(String(p || "")) ? `fiscal year ended ${day(p)}` : (p ? p.charAt(0).toLowerCase() + p.slice(1) : end ? `period ended ${day(end)}` : "");
const go = t => { location.href = "?t=" + encodeURIComponent(t); };
// where a figure was read: the page opens in the Crawler when this computer has the saved read, else the filing on SEC EDGAR
function cite(o, label) {
  if (!o) return "";
  const txt = esc(label || (o.page ? `p.${o.page}` : "source"));
  if (o.read) return `<a class="cite" href="/desk/read/#src=${encodeURIComponent(o.read)}&p=${encodeURIComponent(o.pdf_page || o.page || "")}&t=${encodeURIComponent(T)}" target="_blank" rel="noopener" title="Open this page in the Crawler">${txt}</a>`;
  if (o.url) return `<a class="cite" href="${esc(o.url)}" target="_blank" rel="noopener" title="Open the filing on SEC EDGAR">${txt}</a>`;
  return (o.page || label) ? `<span class="cite">${txt}</span>` : "";
}
const sec = (id, title, small, body) => `<section class="sec wrap" id="${id}"><h2>${title}${small ? ` <small>${small}</small>` : ""}</h2>${body}</section>`;

// ------------------------------------------------------------------ search (this page's own: any company on the map, or any ticker)
let UNI = null;                       // one request, shared by everyone who asks while it is under way
function universe() {
  if (!UNI) UNI = (async () => { const list = [];
    try { const u = await getJSON("/api/brain/universe");
      for (const s of u.sectors || []) for (const x of s.sub_industries || []) for (const c of x.companies || []) list.push({t: c.ticker, name: c.name || "", also: c.tickers || []});
    } catch (e) { UNI = null; }
    return list; })();
  return UNI;
}

  if (r && (r.comps || []).length) quotes(r.comps.map(c => c.ticker)).then(q => { for (const c of r.comps) { const x = q[c.ticker]; if (!x) continue;
    const a = document.querySelector(`[data-px="${CSS.escape(c.ticker)}"]`), b = document.querySelector(`[data-ch="${CSS.escape(c.ticker)}"]`);
    if (a) a.textContent = usd(x.price); if (b) { b.textContent = pct(x.change_pct); b.className = "n " + cls(x.change_pct); } } });
}
function keepScroll(fn) { const y = scrollY; fn(); scrollTo({top: y, behavior: "instant"}); }      // a redraw never moves the page under the reader
async function compare(list) {
  const out = $("cmp-out"); if (!out) return;
  if (!list.length) { out.textContent = "Pick a company."; return; }
  out.innerHTML = `<span class="skel" style="width:50%"></span>`;
  try {
    const d = await getJSON(`/api/brain/${encodeURIComponent(S.report.ticker)}/peers?peers=${encodeURIComponent(list.join(","))}`);
    const cos = [d.ticker, ...(d.peers || [])];
    if (!(d.rows || []).length) { out.textContent = (d.note || "No figures to line up.") + ((d.not_in_brain || []).length ? ` Not read yet: ${d.not_in_brain.join(", ")}.` : ""); return; }
    out.innerHTML = `<div class="scroll"><table class="tbl"><thead><tr><th>Measure</th>${cos.map(t => `<th class="n">${esc(t)}</th>`).join("")}</tr></thead><tbody>${d.rows.map(row => {
      const by = Object.fromEntries((row.cells || []).map(c => [c.ticker, c]));
      return `<tr><td>${esc(row.measure)}${row.note ? `<div class="cite" style="white-space:normal">${esc(row.note)}</div>` : ""}</td>${cos.map(t => { const c = by[t], s = (c && c.src) || {};
        return c ? `<td class="n">${esc(c.display || "")}${c.rank ? ` <span class="cite">#${esc(String(c.rank).split(" ")[0])}</span>` : ""}${cite({page: s.printed_page || s.pdf_page, url: s.url})}</td>` : `<td class="n" style="color:var(--faint)">.</td>`; }).join("")}</tr>`;
    }).join("")}</tbody></table></div>${(d.not_in_brain || []).length ? `<p class="note">Not read yet: ${d.not_in_brain.map(esc).join(", ")}.</p>` : ""}<p class="note">${esc(d.note || "")}</p>`;
  } catch (e) { out.textContent = e.message; }
}
// the one request that is not a read: ask the Crawler to read the company's latest 10-K (it files the read in the brain itself)
async function readNow(btn) {
  const st = $("learn-st"); btn.disabled = true; st.textContent = "Asking the Crawler...";
  try {
    const r = await fetch("/api/brain-learn", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({tickers: [T], forms: "10-K", per: 1})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok && !(r.status === 409 && j.running)) { st.textContent = j.error || `The Crawler answered ${r.status}.`; btn.disabled = false; return; }
    const poll = async () => {
      let d; try { d = await getJSON("/api/brain-learn"); } catch (e) { st.textContent = e.message; btn.disabled = false; return; }
      const it = (d.items || []).find(i => i.ticker === T);
      st.textContent = it ? `${it.state}${it.error ? `: ${it.error}` : ""}` : d.running ? "The Crawler is reading another company first..." : "";
      if (d.running) { setTimeout(poll, 3000); return; }
      if (it && it.state === "done") { st.textContent = "Read. Loading what it found..."; S.report = null; loadReport(); } else btn.disabled = false;
    };
    poll();
  } catch (e) { st.textContent = "Could not reach the Crawler."; btn.disabled = false; }
}

// ------------------------------------------------------------------ the section tabs follow the page
// The tab of the section whose heading has reached the top of the view is lit (the last section at the page's end).
// On a bar too narrow for every tab the strip scrolls: the lit tab is brought into sight when it changes or the strip's
// width does (never while the reader is scrolling the strip by hand), and the cut edge fades out.
function tabsEdge() { const strip = $("tabs"); strip.classList.toggle("more", strip.scrollWidth - strip.clientWidth - strip.scrollLeft > 2); }
function keepLit() {
  const strip = $("tabs"), a = strip.querySelector("a.on");
  if (a) { const sr = strip.getBoundingClientRect(), ar = a.getBoundingClientRect();
    if (ar.width && (ar.left < sr.left || ar.right > sr.right)) strip.scrollLeft += ar.left - sr.left - 12; }
  tabsEdge();
}
function spy() {
  const tabs = [...$("tabs").querySelectorAll("a")], secs = [...document.querySelectorAll("main section[id]")];
  let cur = secs[0], moved = false;
  for (const s of secs) if (s.getBoundingClientRect().top <= 140) cur = s;
  if (secs.length && innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1];
  for (const a of tabs) { const on = !!cur && a.dataset.s === cur.id; if (on !== a.classList.contains("on")) { a.classList.toggle("on", on); moved = true; } }
  if (moved) keepLit(); else tabsEdge();
}
let spyT = 0;
addEventListener("scroll", () => { if (!spyT) spyT = requestAnimationFrame(() => { spyT = 0; spy(); }); }, {passive: true});
$("tabs").addEventListener("scroll", tabsEdge, {passive: true});
addEventListener("resize", keepLit);
// the small name and price join the bar once the big price has scrolled under it, and the tabs lose that width
new IntersectionObserver(es => { $("bar").classList.toggle("past", !es[0].isIntersecting); keepLit(); }, {rootMargin: "-100px 0px 0px 0px"}).observe($("px"));

// ------------------------------------------------------------------ load: everything at once, each part drawn as it arrives
async function loadReport() {
  try { S.report = await getJSON(`/api/brain/${encodeURIComponent(T)}/report`); S.gone.report = ""; }
  catch (e) { S.report = null; S.gone.report = /403|local Crawler/i.test(e.message) ? "This page works on the Crawler on your Mac (localhost), where the vault is." : e.message; S.gone.offmap = /not on the brain's map/.test(e.message); }
  identity(); about(); brain();
}
// nothing answers for this ticker (SEC has no such filer, the brain has no such company, no price): say so and offer the nearest names
async function missing() {
  if (S.report || S.profile || S.snap || !S.gone.profile || !/No SEC filer|Not a ticker/i.test(S.gone.profile) || (S.charts["1D"] && (S.charts["1D"].points || []).length)) return;
  const near = merge(merge(matches(await universe(), T), await others(T)), matches(await universe(), T.slice(0, 3))).slice(0, 6);
  $("bar").hidden = true;
  main.innerHTML = `<div class="wrap landing"><h1>No company found for "${esc(T)}"</h1><p>No SEC filer has that ticker and it is not on the brain's map. Check the ticker, or search by name.</p>
    <div class="find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><input id="q2" type="search" placeholder="Search a company or ticker" autocomplete="off" spellcheck="false" aria-label="Search a company or ticker" autofocus><ul id="hits2"></ul></div>
    ${near.length ? `<p style="margin-top:26px">Did you mean</p><div>${near.map(c => `<a class="tk" href="?t=${encodeURIComponent(c.t)}">${esc(c.t)} ${esc(c.name)}</a>`).join("")}</div>` : ""}</div>`;
  wireSearch($("q2"), $("hits2"));
  document.title = `${T} not found | BMG Capital`;
}
async function refreshQuote() { const q = await quotes([T]); if (q[T]) { S.quote = q[T]; paintPrice(); stats(); } }
function start() {
  about(); stats(); brain(); drawChart(); logo();
  const all = [];
  all.push(getJSON(`/api/brain/${encodeURIComponent(T)}/profile`).then(p => { S.profile = p; }).catch(e => { S.gone.profile = e.message; }).finally(() => { identity(); about(); spy(); }));
  all.push(getJSON(`/api/snapshot?ticker=${encodeURIComponent(T)}`).then(s => { S.snap = s; }).catch(e => { S.snap = null; S.gone.snap = e.message; }).finally(() => { identity(); stats(); keepScroll(brain); }));
  all.push(loadReport(), loadRange("1D").then(identity));
  Promise.all(all).then(missing);
  getJSON(`/api/read/history?ticker=${encodeURIComponent(T)}&years=10`).then(h => { S.hist = h; }).catch(e => { S.hist = null; S.gone.hist = e.message || "no history"; }).finally(() => keepScroll(brain));
  getJSON(`/api/edgar/filings?ticker=${encodeURIComponent(T)}&earnings=1&limit=8`).then(d => { S.edgar = d.filings || []; }).catch(() => { S.edgar = null; }).finally(() => keepScroll(brain));
  getJSON(`/api/market/stats?ticker=${encodeURIComponent(T)}`).then(s => { S.stats = s; }).catch(e => { S.stats = null; S.gone.stats = e.message; }).finally(stats);
  refreshQuote();
  earnings(30).then(e => { S.er = e; identity(); });
  getJSON("/api/brain").then(b => { const v = (b.brain_vault || b.vault || "").split(/[\\/]/).filter(Boolean).pop() || "";
    if (v) { S.obs = `obsidian://open?vault=${encodeURIComponent(v)}&file=${encodeURIComponent(`brain/companies/${T}/${T}`)}`; if (S.report) keepScroll(brain); } }).catch(() => {});
  setInterval(() => { if (document.hidden) return; refreshQuote(); if (S.range === "1D" && S.hover == null) loadRange("1D", true); }, 60000);
}
S.stats = null; S.snap = null;
start();
})();
