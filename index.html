<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>BMG Capital</title>
<link rel="icon" href="/assets/bmg-capital-logo.png">
<style>
  html,body{margin:0;height:100%;background:#fff}
  body{display:flex;align-items:center;justify-content:center}
  .logo{all:unset;cursor:zoom-in;display:block;line-height:0;-webkit-tap-highlight-color:transparent}
  .logo:focus-visible{outline:2px solid #2fdc74;outline-offset:8px;border-radius:6px}
  .logo img{display:block;width:min(720px,86vw);height:auto}
  /* full screen: the logo as large as the screen allows */
  .logo:fullscreen{background:#fff;display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  .logo:fullscreen img{width:96vw;max-height:96vh;object-fit:contain}
  .logo:-webkit-full-screen{background:#fff;display:flex;align-items:center;justify-content:center;width:100%;height:100%;cursor:zoom-out}
  .logo:-webkit-full-screen img{width:96vw;max-height:96vh;object-fit:contain}
  /* where the browser has no full-screen mode for elements (iPhone): fill the window */
  .logo.fill{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;cursor:zoom-out;z-index:1}
  .logo.fill img{width:96vw;max-height:96vh;object-fit:contain}
</style>
</head>
<body>
<button class="logo" id="logo" type="button" aria-label="BMG Capital logo: show full screen">
  <picture><source srcset="/assets/bmg-capital-logo.webp" type="image/webp"><img src="/assets/bmg-capital-logo.png" alt="BMG Capital" width="2000" height="727"></picture>
</button>
<script>
(() => {
  const b = document.getElementById("logo");
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  const label = on => b.setAttribute("aria-label", on ? "BMG Capital logo: exit full screen" : "BMG Capital logo: show full screen");
  b.addEventListener("click", () => {
    if (fsEl()) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
    if (b.classList.contains("fill")) { b.classList.remove("fill"); label(false); return; }
    const req = b.requestFullscreen || b.webkitRequestFullscreen;
    if (req) {
      const p = req.call(b);
      if (p && p.catch) p.catch(() => { b.classList.add("fill"); label(true); });
    } else { b.classList.add("fill"); label(true); }
  });
  const sync = () => label(!!fsEl());
  document.addEventListener("fullscreenchange", sync);
  document.addEventListener("webkitfullscreenchange", sync);
  document.addEventListener("keydown", e => { if (e.key === "Escape" && b.classList.contains("fill")) { b.classList.remove("fill"); label(false); } });
})();
</script>
</body>
</html>
